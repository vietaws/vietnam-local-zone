<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EC2 Instance Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: #f8f9fa;
      padding: 40px 30px;
      text-align: center;
      border-bottom: 1px solid #e9ecef;
    }

    .header h1 {
      color: #333;
      font-size: 1.75rem;
      margin-bottom: 8px;
    }

    .header p {
      color: #888;
      font-size: 0.9rem;
    }

    .cards {
      padding: 30px;
      display: grid;
      gap: 16px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border-left: 4px solid #667eea;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.15);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.2rem;
    }

    .card-body {
      min-width: 0;
    }

    .card-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .card-value {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      word-break: break-all;
    }

    .card-value.loading {
      color: #bbb;
      font-weight: 400;
      font-style: italic;
    }

    .card-value.error {
      color: #dc3545;
    }

    .refresh-btn {
      display: block;
      width: calc(100% - 60px);
      margin: 0 30px 30px;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .refresh-btn:hover { opacity: 0.9; }
    .refresh-btn:active { transform: scale(0.98); }
    .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer {
      background: #f8f9fa;
      padding: 16px 30px;
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
      border-top: 1px solid #e9ecef;
    }

    @media (max-width: 480px) {
      .header { padding: 30px 20px; }
      .header h1 { font-size: 1.4rem; }
      .cards { padding: 20px; gap: 12px; }
      .card { padding: 16px; }
      .card-icon { width: 38px; height: 38px; font-size: 1rem; }
      .card-value { font-size: 0.95rem; }
      .refresh-btn { width: calc(100% - 40px); margin: 0 20px 20px; }
      .footer { padding: 14px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>EC2 Instance Info</h1>
      <p>AWS instance metadata</p>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-icon">🌏</div>
        <div class="card-body">
          <div class="card-label">Region</div>
          <div class="card-value loading" id="region">Loading…</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">🏢</div>
        <div class="card-body">
          <div class="card-label">Availability Zone ID</div>
          <div class="card-value loading" id="azId">Loading…</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">🖥️</div>
        <div class="card-body">
          <div class="card-label">Instance ID</div>
          <div class="card-value loading" id="instanceId">Loading…</div>
        </div>
      </div>
    </div>

    <button class="refresh-btn" id="refreshBtn" onclick="loadMetadata()">Refresh</button>

    <div class="footer">Vietnam Local Zone Demo &mdash; <span id="ts"></span></div>
  </div>

  <script>
    function setTimestamp() {
      document.getElementById('ts').textContent = new Date().toLocaleString();
    }

    async function loadMetadata() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Loading…';

      const fields = ['region', 'azId', 'instanceId'];
      fields.forEach(id => {
        const el = document.getElementById(id);
        el.textContent = 'Loading…';
        el.className = 'card-value loading';
      });

      try {
        const res = await fetch('/api/metadata');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        const map = { region: data.region, azId: data.azId, instanceId: data.instanceId };
        for (const [id, value] of Object.entries(map)) {
          const el = document.getElementById(id);
          el.textContent = value || 'N/A';
          el.className = 'card-value' + (value === 'N/A' ? ' error' : '');
        }
        setTimestamp();
      } catch (err) {
        console.error('Failed to load metadata:', err);
        fields.forEach(id => {
          const el = document.getElementById(id);
          el.textContent = 'Error';
          el.className = 'card-value error';
        });
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh';
      }
    }

    loadMetadata();
  </script>
</body>
</html>
