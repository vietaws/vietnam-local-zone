apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: singapore-hanoi-cluster
  region: ap-southeast-1

nodeGroups: 
  - name: hanoi-edge-nodes
    instanceType: c7i.16xlarge # Must be supported in ap-southeast-1-han-1a
    desiredCapacity: 1
    subnets:
      - "PASTE_YOUR_SUBNET_ID_HERE" # Explicit Subnet ID built from your custom CIDR block
    taints:
      - key: "local-zone"
        value: "true"
        effect: "NoSchedule"
